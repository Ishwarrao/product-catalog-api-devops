version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-catalog-backend
    ports:
      - "5000:5000"
    volumes:
      - backend_data:/app  # persist database
    environment:
      - FLASK_ENV=production

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: product-catalog-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_data: