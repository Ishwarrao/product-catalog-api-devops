<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Catalog</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f8f9fa;
      padding: 2rem;
    }
    .product-card {
      box-shadow: 0 2px 18px rgba(22, 160, 133, 0.12);
      border-radius: 16px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #f8fafc 90%, #e9f7ef 100%);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(22, 160, 133, 0.3);
    }
    .product-img {
      height: 170px;
      object-fit: cover;
      width: 100%;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .product-price {
      font-size: 1.2rem;
      font-weight: bold;
      color: #27ae60;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 700;
      font-size: 2.5rem;
      color: #117a65;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="header">Product Catalog</h1>
    <div id="productGrid" class="row g-4"></div>
  </div>

  <script>
    function getProductImage(productName) {
  const imageMap = {
    "Wireless Headphones": "https://images.pexels.com/photos/374906/pexels-photo-374906.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Smartphone": "https://images.pexels.com/photos/1092671/pexels-photo-1092671.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Gaming Laptop": "https://images.pexels.com/photos/777001/pexels-photo-777001.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Bluetooth Speaker": "https://images.pexels.com/photos/7130533/pexels-photo-7130533.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Smartwatch": "https://images.pexels.com/photos/267394/pexels-photo-267394.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Digital Camera": "https://images.pexels.com/photos/306254/pexels-photo-306254.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Electric Toothbrush": "https://images.pexels.com/photos/8887998/pexels-photo-8887998.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Coffee Maker": "https://images.pexels.com/photos/376464/pexels-photo-376464.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Gaming Chair": "https://images.pexels.com/photos/129208/pexels-photo-129208.jpeg?auto=compress&w=400&h=250&fit=crop",
    "4K Monitor": "https://images.pexels.com/photos/256273/pexels-photo-256273.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Wireless Mouse": "https://images.pexels.com/photos/7357/pexels-photo.jpg?auto=compress&w=400&h=250&fit=crop",
    "Mechanical Keyboard": "https://images.pexels.com/photos/461064/pexels-photo-461064.jpeg?auto=compress&w=400&h=250&fit=crop",
    "External SSD": "https://images.pexels.com/photos/39284/pexels-photo-39284.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Noise Cancelling Earbuds": "https://images.pexels.com/photos/1350175/pexels-photo-1350175.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Fitness Tracker": "https://images.pexels.com/photos/4039444/pexels-photo-4039444.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Smart Thermostat": "https://images.pexels.com/photos/1617341/pexels-photo-1617341.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Drone": "https://images.pexels.com/photos/442587/pexels-photo-442587.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Electric Scooter": "https://images.pexels.com/photos/2280940/pexels-photo-2280940.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Action Camera": "https://images.pexels.com/photos/96381/pexels-photo-96381.jpeg?auto=compress&w=400&h=250&fit=crop",
    "Smart Light Bulbs": "https://images.pexels.com/photos/577514/pexels-photo-577514.jpeg?auto=compress&w=400&h=250&fit=crop"
  };
  // fallback to default if any product is missing
  return imageMap[productName] || "https://images.pexels.com/photos/1591060/pexels-photo-1591060.jpeg?auto=compress&w=400&h=250&fit=crop";
}

    async function loadProducts() {
      try {
        const response = await fetch('http://127.0.0.1:5000/products');
        if (!response.ok) throw new Error('Network response was not ok');
        const products = await response.json();

        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        if (products.length === 0) {
          grid.innerHTML = '<p class="text-center fs-5">No products found.</p>';
          return;
        }

        products.forEach((product) => {
          const imgSrc = getProductImage(product.name);

          const card = document.createElement('div');
          card.className = 'col-sm-6 col-md-4 col-lg-3';

          card.innerHTML = `
            <div class="product-card bg-white">
              <img src="${imgSrc}" alt="${product.name}" class="product-img" />
              <div class="p-3">
                <h5 class="mb-2">${product.name}</h5>
                <p class="text-muted mb-2">${product.description}</p>
                <p class="product-price">$${Number(product.price).toFixed(2)}</p>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (error) {
        document.getElementById('productGrid').innerHTML = `<p class="text-danger text-center">Failed to load products: ${error.message}</p>`;
      }
    }

    loadProducts();
  </script>
</body>
</html>
